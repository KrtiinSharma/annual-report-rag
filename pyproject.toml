[project]
name = "annual-report-rag"
version = "0.1.0"
description = "Annual Report Analyst: hybrid + vectorless RAG over Indian annual reports with LangChain, LangSmith and RAGAS"
readme = "README.md"
authors = [
    { name = "Krtiin Sharma", email = "krtiinsharma2415@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-community>=0.4,<0.4.2",  # ragas 0.4.x imports chat_models.vertexai, removed in 0.4.2
    "langchain-text-splitters>=0.3",
    "langchain-groq>=0.3",
    "langchain-chroma>=0.2",
    "langsmith>=0.3",
    "chromadb>=0.6",
    "fastembed>=0.5",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "pandas>=2.2",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.33.0",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
arr-download = "annual_report_rag.ingest.download:main"
arr-ingest = "annual_report_rag.ingest.build_index:main"
arr-tree = "annual_report_rag.vectorless.tree:main"
arr-eval = "annual_report_rag.eval.run_eval:main"
arr-serve = "annual_report_rag.api.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
